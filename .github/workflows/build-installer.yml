name: Installer bauen

# Baut den Windows-Installer (PyInstaller + Inno Setup) automatisiert auf einem
# GitHub-Windows-Runner - macht inhaltlich dasselbe wie build_installer.bat lokal.
# Dazu (Vorschau, Marco 07.10.2026): die macOS-App als .dmg für Apple Silicon und Intel
# (Job build-macos) sowie AppImage und .deb für Linux (Job build-linux), jeweils mit
# demselben --selbsttest wie die Windows-EXE. Mac und Linux sind nicht signiert.
#
# Ausgelöst durch:
#   - einen gepushten Versions-Tag nach dem Muster "vX.Y.Z" (z. B. "v1.2.0")
#     -> baut UND veröffentlicht die Setup-.exe (dazu .dmg, AppImage, .deb) als GitHub Release
#   - manuell über den Button "Run workflow" (workflow_dispatch)
#     -> baut nur und lädt das Ergebnis als Artefakt hoch, zum Testen, ohne
#        gleich ein Release zu erzeugen
#
# WICHTIG zur Versionsnummer: Dieser Workflow ruft bump_version.py NICHT auf und
# erhöht die Versionsnummer also nicht selbst. Er baut mit der Nummer, die bereits
# in version.txt eingecheckt ist. Ablauf für ein Release:
#   1. Lokal einmal `python bump_version.py` laufen lassen
#   2. `python tools/handbuch_pdf.py` ausführen, dann die geänderten
#      version.txt/version_info.txt/version.py und docs/HANDBUCH.md/.pdf
#      committen und pushen
#   3. Dann den Tag setzen: `git tag v1.2.0 && git push origin v1.2.0`
# So bleibt version.txt die einzige, eindeutige Quelle der Versionsnummer - siehe
# README_INSTALLER.md.

# Sicherheitsprüfung 03.10.2026, S-3: Fremde Actions sind auf einen festen Commit-Hash
# festgelegt (dahinter als Kommentar die Version) - ein nachträglich verschobener Tag
# kann so keinen anderen Code in den Build bringen. Aktualisieren: neuen Hash per
# "git ls-remote https://github.com/<owner>/<action> refs/tags/<version>" ermitteln.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# S-3: Der Build-Job (installiert Fremdpakete) hat nur Leserechte; das Schreibrecht zum
# Anlegen des GitHub-Release hat allein der getrennte release-Job.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # S-3: feste PyInstaller-Version (Stand 03.10.2026) - Updates bewusst hier anheben.
          pip install pyinstaller==6.22.3

      - name: Versionsnummer aus version.txt auslesen
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Prüfen, dass der Tag zu version.txt passt (nur bei einem Versions-Tag)
        # Verhindert genau den Fehler, der schon einmal passiert ist: wenn ein Tag
        # (z.B. "v1.0.8") gesetzt/gepusht wird, BEVOR die per "python bump_version.py"
        # erhöhte version.txt committet und gepusht wurde, baut dieser Workflow
        # anstandslos mit der ALTEN Nummer aus version.txt weiter (z.B. "1.0.7") - der
        # fertige Installer heißt dann irreführend anders als der Tag/das Release. Bricht
        # jetzt stattdessen VOR dem eigentlichen Build klar erkennbar ab.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        # S-9 (Sicherheitsprüfung 03.10.2026): Tag-Name nur über eine Umgebungsvariable statt
        # direkt ins Skript eingesetzt (sonst würde z. B. ein Tag "v$(...)" ausgeführt), und
        # nur im Format vX.Y.Z.
        env:
          TAG_NAME: ${{ github.ref_name }}
          DATEI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:TAG_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Tag hat nicht das Format vX.Y.Z"
            exit 1
          }
          $tagVersion = $env:TAG_NAME.Substring(1)
          $fileVersion = $env:DATEI_VERSION
          if ($tagVersion -ne $fileVersion) {
            Write-Error "Tag '$($env:TAG_NAME)' passt nicht zu version.txt (enthaelt '$fileVersion'). Vermutlich wurde getaggt, BEVOR die per 'python bump_version.py' erhoehte version.txt committet und gepusht wurde - siehe README_INSTALLER.md, Ablauf fuer ein Release. Zuerst 'python bump_version.py' laufen lassen, version.txt/version_info.txt/version.py committen und pushen, DANACH den (neuen) Tag setzen."
            exit 1
          }

      - name: .exe mit PyInstaller bauen
        run: pyinstaller build.spec

      - name: Prüfen, ob dist\SHS-Pruefungsprogramm.exe entstanden ist
        shell: pwsh
        run: |
          if (!(Test-Path "dist\SHS-Pruefungsprogramm.exe")) {
            Write-Error "PyInstaller hat keine dist\SHS-Pruefungsprogramm.exe erzeugt"
            exit 1
          }

      - name: Selbsttest der gebauten .exe (--selbsttest)
        # T1 (Marco 03.10.2026): startet die frisch gebaute EXE ohne Fenster und prüft
        # Termin, Auswertung, alle PDFs, Anmeldeformular-Import (pypdf), CSV, verschlüsselte
        # Sicherung (pyzipper), die Oberfläche mit allen Reitern und das Programmsymbol - fehlt
        # in build.spec ein Modul/Plugin/eine Datei, scheitert der Build HIER statt erst beim
        # Nutzer. Dieselbe Prüfung läuft in build-macos und build-linux.
        shell: pwsh
        run: |
          $protokoll = Join-Path $env:RUNNER_TEMP "selbsttest_exe.log"
          $p = Start-Process -FilePath "dist\SHS-Pruefungsprogramm.exe" -ArgumentList "--selbsttest", "`"$protokoll`"" -Wait -PassThru
          if (Test-Path $protokoll) { Get-Content $protokoll } else { Write-Host "Kein Protokoll geschrieben" }
          if ($p.ExitCode -ne 0) { Write-Error "Selbsttest der .exe fehlgeschlagen (Exit-Code $($p.ExitCode))"; exit 1 }

      - name: Inno Setup installieren
        # S-3: feste Inno-Setup-Version (Stand 03.10.2026)
        run: choco install innosetup --version=6.7.1 -y

      - name: Installer mit Inno Setup bauen
        run: ISCC installer.iss /DMyAppVersion=${{ steps.version.outputs.version }}

      - name: Installer still installieren, installierte .exe testen, deinstallieren
        # T1 (Marco 03.10.2026): prüft auch die Inno-Setup-Paketierung. Installation nur für
        # den aktuellen Benutzer in einen Temp-Ordner, danach wieder entfernen.
        shell: pwsh
        run: |
          $setup = Get-ChildItem "Output\SHS-Pruefungsprogramm-Setup-*.exe" | Select-Object -First 1
          $ziel = Join-Path $env:RUNNER_TEMP "shs-installiert"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$ziel`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Installation fehlgeschlagen (Exit-Code $($p.ExitCode))"; exit 1 }
          $exe = Join-Path $ziel "SHS-Pruefungsprogramm.exe"
          if (!(Test-Path $exe)) { Write-Error "Installierte .exe fehlt: $exe"; exit 1 }
          $protokoll = Join-Path $env:RUNNER_TEMP "selbsttest_installiert.log"
          $t = Start-Process -FilePath $exe -ArgumentList "--selbsttest", "`"$protokoll`"" -Wait -PassThru
          if (Test-Path $protokoll) { Get-Content $protokoll } else { Write-Host "Kein Protokoll geschrieben" }
          $u = Start-Process -FilePath (Join-Path $ziel "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($t.ExitCode -ne 0) { Write-Error "Selbsttest der installierten .exe fehlgeschlagen (Exit-Code $($t.ExitCode))"; exit 1 }
          if ($u.ExitCode -ne 0) { Write-Error "Deinstallation fehlgeschlagen (Exit-Code $($u.ExitCode))"; exit 1 }

      - name: Setup-.exe als Artefakt hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHS-Pruefungsprogramm-Setup-${{ steps.version.outputs.version }}
          path: Output\SHS-Pruefungsprogramm-Setup-*.exe

  build-macos:
    # Vorschau (Marco 07.10.2026): je Mac-Typ auf dem passenden Runner gebaut und getestet,
    # weil PyInstaller nur für die Architektur des laufenden Pythons baut.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            typ: AppleSilicon
          - runner: macos-15-intel
            typ: Intel
    runs-on: ${{ matrix.runner }}
    # Ein hängender Selbsttest soll das Release (wartet per needs) nicht stundenlang aufhalten.
    timeout-minutes: 45
    steps:
      - name: Code auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: App mit PyInstaller bauen
        run: pyinstaller build.spec

      - name: Ad-hoc-Signatur der App prüfen
        # Ohne gültige (Ad-hoc-)Signatur meldet macOS auf Apple-Silicon-Macs "beschädigt"
        # statt des normalen Dialogs für nicht registrierte Programme.
        run: codesign --verify --deep --strict --verbose=2 dist/SHS-Pruefungsprogramm.app

      - name: Selbsttest der gebauten App
        run: |
          protokoll="$RUNNER_TEMP/selbsttest_app.log"
          status=0
          dist/SHS-Pruefungsprogramm.app/Contents/MacOS/SHS-Pruefungsprogramm --selbsttest "$protokoll" || status=$?
          cat "$protokoll" || echo "Kein Protokoll geschrieben"
          exit $status

      - name: .dmg erstellen und die App daraus testen
        # Die App liegt im Abbild neben einer Verknüpfung auf "Programme" zum Hineinziehen.
        env:
          MAC_TYP: ${{ matrix.typ }}
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          mkdir -p dmg Output
          cp -R dist/SHS-Pruefungsprogramm.app dmg/
          ln -s /Applications dmg/Applications
          dmg="Output/SHS-Pruefungsprogramm-$version-macOS-$MAC_TYP.dmg"
          hdiutil create -volname "SHS-Pruefungsprogramm" -srcfolder dmg -ov -format UDZO "$dmg"
          laufwerk="$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3)"
          protokoll="$RUNNER_TEMP/selbsttest_dmg.log"
          status=0
          "$laufwerk/SHS-Pruefungsprogramm.app/Contents/MacOS/SHS-Pruefungsprogramm" --selbsttest "$protokoll" || status=$?
          cat "$protokoll" || echo "Kein Protokoll geschrieben"
          hdiutil detach "$laufwerk"
          exit $status

      - name: .dmg als Artefakt hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHS-Pruefungsprogramm-macOS-${{ matrix.typ }}
          path: Output/*.dmg

  build-linux:
    # Vorschau (Marco 07.10.2026). Ubuntu 22.04 statt "latest": das Programm läuft dann auch
    # auf Systemen mit älterer glibc (ab 2.35, z. B. Ubuntu 22.04, Debian 12, Mint 21).
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Code auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Qt-Systembibliotheken installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libdbus-1-3 libfontconfig1 libglib2.0-0 libgl1

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Programmordner mit PyInstaller bauen
        run: pyinstaller build.spec

      - name: Selbsttest des gebauten Programms
        run: |
          protokoll="$RUNNER_TEMP/selbsttest_linux.log"
          status=0
          dist/SHS-Pruefungsprogramm/SHS-Pruefungsprogramm --selbsttest "$protokoll" || status=$?
          cat "$protokoll" || echo "Kein Protokoll geschrieben"
          exit $status

      - name: appimagetool und AppImage-Runtime laden (feste Version, Prüfsumme)
        # S-3: feste Versionen mit Prüfsumme (Stand 07.10.2026: appimagetool 1.9.1,
        # type2-runtime 20251108). Ohne --runtime-file würde appimagetool die Runtime
        # ungeprüft in der jeweils neuesten Fassung nachladen.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o "$RUNNER_TEMP/runtime" https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/runtime" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: AppImage und .deb bauen
        run: bash tools/linux_pakete.sh "$(tr -d '[:space:]' < version.txt)" "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/runtime"

      - name: AppImage testen
        run: |
          protokoll="$RUNNER_TEMP/selbsttest_appimage.log"
          status=0
          chmod +x Output/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./Output/*.AppImage --selbsttest "$protokoll" || status=$?
          cat "$protokoll" || echo "Kein Protokoll geschrieben"
          exit $status

      - name: .deb installieren, testen, entfernen
        run: |
          sudo apt-get install -y ./Output/*.deb
          protokoll="$RUNNER_TEMP/selbsttest_deb.log"
          status=0
          shs-pruefungsprogramm --selbsttest "$protokoll" || status=$?
          cat "$protokoll" || echo "Kein Protokoll geschrieben"
          sudo apt-get remove -y shs-pruefungsprogramm
          exit $status

      - name: AppImage und .deb als Artefakt hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHS-Pruefungsprogramm-Linux
          path: |
            Output/*.AppImage
            Output/*.deb

  release:
    # S-3: eigener Job mit Schreibrecht, nur bei einem Versions-Tag - führt keinen Build-
    # Code aus, sondern veröffentlicht nur die geprüften Artefakte der Build-Jobs.
    # Mac und Linux sind Vorschau (Marco 07.10.2026): Schlägt einer dieser Jobs fehl, wird
    # das Release trotzdem mit der Windows-Version erstellt (always() + Prüfung von build);
    # es fehlen dann nur die betroffenen Dateien. Der fehlgeschlagene Job bleibt im Lauf rot.
    needs: [build, build-macos, build-linux]
    if: always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # nötig, um das GitHub-Release anzulegen
    steps:
      - name: Code auschecken (für RELEASE_NOTES.md)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup-.exe aus dem build-Job holen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SHS-Pruefungsprogramm-Setup-${{ needs.build.outputs.version }}
          path: Output

      - name: Mac- und Linux-Dateien holen (soweit gebaut)
        # Fehlt ein Artefakt (Job fehlgeschlagen), fehlt nur diese Datei im Release.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: SHS-Pruefungsprogramm-{macOS,Linux}*
          path: Output
          merge-multiple: true

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            Output/SHS-Pruefungsprogramm-Setup-*.exe
            Output/*.dmg
            Output/*.AppImage
            Output/*.deb
          fail_on_unmatched_files: false
          # Kurze deutsche Beschreibung "Was ist neu" (wird vor jedem Build neu geschrieben),
          # darunter die automatisch erzeugte Commit-Liste.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
