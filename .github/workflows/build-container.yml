name: Container bauen

# Baut das Web-Backend-Image (Containerfile) und prüft es über einen echten
# Compose-Stack (PostgreSQL + Web-Container, siehe compose.yaml) - macht inhaltlich
# dasselbe wie ein Nutzer später mit "podman-compose up". Läuft bei jedem Push/Pull
# Request (Smoke-Test, kein Push in die Registry), analog zu tests.yml.
#
# Ausgelöst durch:
#   - jeden Push/Pull Request -> baut das Image lokal und prüft per Smoke-Test, ob der
#     Compose-Stack tatsächlich hochkommt und die Login-Seite antwortet (kein Registry-
#     Push - reine Absicherung, dass Containerfile/compose.yaml nicht kaputt sind)
#   - einen gepushten Versions-Tag nach dem Muster "vX.Y.Z" (z. B. "v1.2.0")
#     -> zusätzlich: Image nach ghcr.io veröffentlichen, getaggt mit genau dieser
#        Versionsnummer UND "latest" - DERSELBE Tag wie beim Windows-Installer
#        (build-installer.yml), da beide Workflows von demselben Tag ausgelöst werden
#        und dieselbe version.txt als Quelle lesen. Damit tragen .exe und Container-
#        Image nach einem Release immer dieselbe Versionsnummer (sichtbar: Datei-
#        Eigenschaften der .exe bzw. Fußzeile der Web-Oberfläche, siehe
#        app_web.py/templates/base.html).
#   - manuell über den Button "Run workflow" (workflow_dispatch) -> nur Smoke-Test,
#      kein Registry-Push (zum Testen, ohne gleich zu veröffentlichen)
#
# Ablauf für ein Release (identisch zu build-installer.yml, siehe dortiger Kommentar
# und README_INSTALLER.md/README_CONTAINER.md):
#   1. Lokal einmal `python bump_version.py` laufen lassen
#   2. version.txt/version_info.txt/version.py committen und pushen
#   3. Tag setzen: `git tag v1.2.0 && git push origin v1.2.0`
#      -> baut UND veröffentlicht sowohl den Windows-Installer als auch dieses Image

# Sicherheitsprüfung 03.10.2026, S-3: Fremde Actions sind auf einen festen Commit-Hash
# festgelegt (dahinter als Kommentar die Version) - ein nachträglich verschobener Tag
# kann so keinen anderen Code in den Build bringen. Aktualisieren: neuen Hash per
# "git ls-remote https://github.com/<owner>/<action> refs/tags/<version>" ermitteln.

on:
  push:
  pull_request:
  workflow_dispatch:

# S-3: Grundsätzlich nur Leserechte; Schreibrecht für ghcr.io nur im publish-Job.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shs-web

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    # Die Geheimnisse kommen seit H-3 (05.10.2026) nicht mehr aus Umgebungsvariablen,
    # sondern aus den Secret-Dateien in secrets/ (siehe compose.yaml) - der erste Step
    # unten legt sie mit reinen Testwerten an. Seit S-2 (Sicherheitsprüfung 03.10.2026)
    # lehnt die Web-Version Platzhalter und zu kurze Werte ab (Schlüssel >= 32,
    # Einrichtungscode >= 12 Zeichen).
    steps:
      - name: Code auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Secret-Dateien mit Testwerten anlegen
        run: |
          mkdir -p secrets
          printf '%s\n' 'smoketest-db-passwort' > secrets/db_passwort.txt
          printf '%s\n' 'smoketest-schluessel-nur-fuer-ci-0123456789' > secrets/web_secret_key.txt
          printf '%s\n' 'smoketest-einrichtung' > secrets/admin_setup_code.txt

      - name: Selbst signiertes Testzertifikat für den HTTPS-Proxy anlegen
        # Nur für den Smoke-Test (wie die Testwerte oben); das echte Zertifikat erzeugt
        # tools/zertifikat_erzeugen.ps1 einmalig beim Betreiber.
        run: |
          mkdir -p secrets/tls
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 2 \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout secrets/tls/schluessel.pem -out secrets/tls/zertifikat.pem
          chmod 644 secrets/tls/*.pem

      - name: Compose-Stack bauen und starten (PostgreSQL + Web-Container + HTTPS-Proxy)
        run: docker compose -f compose.yaml up --build -d

      - name: Warten, bis die Login-Seite über HTTPS antwortet
        run: |
          for i in $(seq 1 30); do
            if curl -sfk https://localhost:5443/ > /dev/null; then
              echo "Web-Container antwortet über den HTTPS-Proxy."
              exit 0
            fi
            sleep 2
          done
          echo "Web-Container antwortet nach 60s nicht auf https://localhost:5443/ - Logs:"
          docker compose -f compose.yaml logs
          exit 1

      - name: Schnittstelle für das Desktop-Programm und Abschottung prüfen
        # Seit 18.11.2026: Der Desktop spricht /api/ über den HTTPS-Proxy an. Geprüft wird hier nur, was
        # ohne Zugangsdaten geht: Die Schnittstelle antwortet (leere Anmeldung = 400 mit JSON), eine
        # geschützte Route verlangt Anmeldung, und Port 5000 (direkt zum Web-Container) ist von außen
        # nicht erreichbar (nur über den Proxy).
        run: |
          code=$(curl -sk -o /tmp/api.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{}' https://localhost:5443/api/login)
          [ "$code" = "400" ] || { echo "::error::/api/login antwortet mit $code statt 400"; exit 1; }
          grep -q '"fehler"' /tmp/api.json || { echo "::error::/api/login liefert kein JSON mit 'fehler'"; cat /tmp/api.json; exit 1; }
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:5443/ergebnisse/boegen.pdf)
          [ "$code" = "302" ] || { echo "::error::/ergebnisse/boegen.pdf ohne Anmeldung antwortet mit $code statt 302"; exit 1; }
          if curl -sf --max-time 3 http://localhost:5000/ > /dev/null; then
            echo "::error::Port 5000 ist von außen erreichbar (sollte nur über den Proxy gehen)"; exit 1
          fi
          echo "API, Anmeldepflicht und Abschottung in Ordnung."

      - name: Prüfen, dass das Web-Image die PDF-Bausteine enthält (reportlab, Schriften)
        # Der Sammelausdruck der Bewertungsbögen braucht reportlab und die DejaVu-Schriften im Image.
        # pdf_export wird in der Web-App erst beim Aufruf importiert; dieser Schritt fängt ein
        # unvollständiges Image schon im Smoke-Test ab.
        run: |
          docker compose -f compose.yaml exec -T web python -c "import pdf_export, reportlab; print('pdf_export und reportlab vorhanden')"
          docker compose -f compose.yaml exec -T web test -f /app/fonts/DejaVuSansCondensed.ttf

      - name: Prüfen, dass die Schrift der Web-Oberfläche ausgeliefert wird
        # Atkinson Hyperlegible Next aus static/schrift/ (templates/base.html, @font-face) samt Lizenz
        # (Marco 21.11.2026, Erscheinungsbild „Schiefer und Signal“).
        run: |
          docker compose -f compose.yaml exec -T web test -f /app/static/schrift/LICENSE-Atkinson-Hyperlegible-Next.txt
          code=$(curl -sk -o /tmp/schrift.ttf -w '%{http_code}' https://localhost:5443/static/schrift/AtkinsonHyperlegibleNext-Regular.ttf)
          [ "$code" = "200" ] || { echo "::error::Schrift der Web-Oberfläche antwortet mit $code statt 200"; exit 1; }
          [ "$(head -c 4 /tmp/schrift.ttf | od -An -tx1 | tr -d ' ')" = "00010000" ] || { echo "::error::Schriftdatei ist keine TrueType-Datei"; exit 1; }
          echo "Schrift der Web-Oberfläche vorhanden."

      - name: Alle Container gesund?
        run: |
          docker compose -f compose.yaml ps
          unhealthy=$(docker compose -f compose.yaml ps --format '{{.Name}} {{.Health}}' | grep -v -E ' (healthy)?$' || true)
          if [ -n "$unhealthy" ]; then echo "::error::Nicht gesund: $unhealthy"; docker compose -f compose.yaml logs; exit 1; fi

      - name: Compose-Stack stoppen
        if: always()
        run: docker compose -f compose.yaml down -v

  publish:
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # nötig, damit dieser Job bei einem Tag nach ghcr.io pushen darf
    steps:
      - name: Code auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Versionsnummer aus version.txt auslesen
        id: version
        run: echo "version=$(cat version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Prüfen, dass der Tag zu version.txt passt
        # Dieselbe Absicherung wie in build-installer.yml (siehe dortiger Kommentar) -
        # verhindert, dass ein zu früh gesetzter Tag (vor dem Committen/Pushen der per
        # bump_version.py erhöhten version.txt) ein Image mit einer Versionsnummer
        # veröffentlicht, die nicht zum Tag passt.
        env:
          DATEI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # S-9: nur Tags im Format vX.Y.Z
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag hat nicht das Format vX.Y.Z"
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$DATEI_VERSION"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' passt nicht zu version.txt (enthaelt '$file_version'). Vermutlich wurde getaggt, BEVOR die per 'python bump_version.py' erhoehte version.txt committet und gepusht wurde - siehe README_INSTALLER.md, Ablauf fuer ein Release."
            exit 1
          fi

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Bei ghcr.io anmelden
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
