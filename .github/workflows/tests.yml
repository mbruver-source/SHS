name: Tests

# Läuft bei jedem Push und bei jedem Pull Request automatisch die komplette
# Testsuite: test_db.py, test_pdf_export.py, test_shs_core.py, test_bump_version.py
# (reine Logik/Datenschicht, kein Qt) UND test_app_gui.py (echte PySide6-GUI-Tests
# über pytest-qt: Klicks, Checkbox-Toggle, Dialog-Öffnen usw.). Alles läuft headless
# über die Qt-eigene "offscreen"-Plattform (QT_QPA_PLATFORM unten) - es wird also kein
# echter Bildschirm/Xvfb benötigt, nur ein paar Systembibliotheken, die Qt zum Laden
# auch ohne sichtbares Fenster braucht.
#
# Der eigentliche Windows-Installer-Build (PyInstaller + Inno Setup) läuft weiterhin
# separat über build-installer.yml bzw. manuell über build_installer.bat, siehe
# README_INSTALLER.md.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Qt-Systembibliotheken installieren (für headless/offscreen-Betrieb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libdbus-1-3 libfontconfig1

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt

      - name: Tests ausführen
        run: pytest -v