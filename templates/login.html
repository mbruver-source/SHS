{% extends "base.html" %}
{% block titel %}Anmelden – SHS Prüfung{% endblock %}
{% block inhalt %}
<div class="karte">
  <h1>Anmelden</h1>
  <p>Bitte mit deinem Benutzernamen und Passwort anmelden (vom Administrator erhalten).</p>
  {% if fehler %}<div class="fehler">{{ fehler }}</div>{% endif %}
  <form method="post">
    <label for="benutzername">Benutzername</label>
    <input type="text" id="benutzername" name="benutzername" autocomplete="username" autofocus required
           autocapitalize="none" autocorrect="off" spellcheck="false">
    <label for="passwort">Passwort</label>
    <input type="password" id="passwort" name="passwort" autocomplete="current-password" required>
    <p><button type="submit">Anmelden</button></p>
  </form>
</div>
{% endblock %}
