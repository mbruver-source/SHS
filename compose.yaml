# Podman/Docker-Compose-Definition für die Web-Version (Web-Backend + PostgreSQL) -
# siehe README_CONTAINER.md für den vollständigen Ablauf (Geheimnisse in secrets/ und
# .env einrichten, starten, stoppen, Versionsnummer) und Fortschritt.md für den
# Architektur-Hintergrund.
#
# Start (Podman): podman-compose up -d
#   - ohne lokal vorhandenes "web"-Image wird automatisch aus dem Containerfile gebaut
#     (siehe "build:" unten) - für einen erzwungenen Neu-Build: podman-compose up --build -d
#   - um stattdessen das über GitHub Actions veröffentlichte Image genau dieser Version zu
#     verwenden: podman-compose pull && podman-compose up -d
#
# Feste Versionen (Sicherheitshinweis H-2, Marco 05.10.2026): postgres per Digest, das
# web-Image per Versions-Tag (zieht bump_version.py bei jedem Build nach). Digest
# nachziehen: siehe README_CONTAINER.md, Abschnitt "Versionen".
#
# Funktioniert unverändert auch mit "docker compose" (Compose-Spec-Standarddatei).

services:
  db:
    # Hauptversion bleibt bewusst 16 - ein Wechsel bräuchte ein Upgrade des Datenbestands.
    image: postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SHS_DB_USER:-shs}
      # Passwort aus der Secret-Datei statt aus .env (Sicherheitshinweis H-3) - steht so
      # nicht in "podman inspect". Wirkt nur beim allerersten Start mit leerem Volume.
      POSTGRES_PASSWORD_FILE: /run/secrets/shs_db_passwort
      POSTGRES_DB: ${SHS_DB_NAME:-shs}
    secrets:
      - shs_db_passwort
    volumes:
      - shs_postgres_daten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHS_DB_USER:-shs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # NUR auf "localhost" des Rechners, auf dem der Container läuft - NICHT auf
      # "0.0.0.0" (würde die Datenbank ungeschützt im ganzen Vereinsnetz erreichbar
      # machen). Wird gebraucht, damit sync_termin.py (läuft direkt auf diesem Rechner,
      # nicht im Container) den Termin vor der Prüfung veröffentlichen und danach die
      # Ergebnisse zurückholen kann - siehe README_CONTAINER.md, Abschnitt "Zugangscode
      # erzeugen". Der "web"-Dienst selbst erreicht "db" ohnehin über das interne
      # Compose-Netzwerk (Hostname "db"), unabhängig von dieser Zeile.
      - "127.0.0.1:5432:5432"

  web:
    build:
      context: .
      dockerfile: Containerfile
    image: ${SHS_WEB_IMAGE:-ghcr.io/mbruver-source/shs-web:1.0.43}
    restart: unless-stopped
    # Härtung (H-2): Dateisystem nur lesbar (Uploads/Downloads nutzen /tmp), keine
    # Linux-Capabilities (Port 5000 braucht keine), keine Rechteausweitung.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Format/Details siehe db.verbinde_postgres_server() bzw. app_web.py. DSN bewusst
      # ohne Passwort - das kommt getrennt aus der Secret-Datei (H-3, app_web.geheimnis_lesen).
      SHS_POSTGRES_DSN: postgresql://${SHS_DB_USER:-shs}@db:5432/${SHS_DB_NAME:-shs}
      SHS_POSTGRES_PASSWORD_FILE: /run/secrets/shs_db_passwort
      SHS_WEB_SECRET_KEY_FILE: /run/secrets/shs_web_secret_key
      # Einrichtungs-Code für das Anlegen des ersten Administrators (Codeprüfung 22.09.,
      # G1) - ohne ihn verweigert app_web.py die Ersteinrichtung, siehe README_CONTAINER.md.
      SHS_ADMIN_SETUP_CODE_FILE: /run/secrets/shs_admin_setup_code
    secrets:
      - shs_db_passwort
      - shs_web_secret_key
      - shs_admin_setup_code
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Geheimnisse als Dateien im Ordner secrets/ (steht in .gitignore/.containerignore) -
# Anlegen und Umzug von einer älteren .env siehe README_CONTAINER.md, Abschnitt
# "Geheimnisse". Die Dateien müssen für den Container-Benutzer lesbar sein.
secrets:
  shs_db_passwort:
    file: ./secrets/db_passwort.txt
  shs_web_secret_key:
    file: ./secrets/web_secret_key.txt
  shs_admin_setup_code:
    file: ./secrets/admin_setup_code.txt

volumes:
  # Bleibt über Neustarts/"compose down" hinweg erhalten (nur "compose down -v" löscht
  # auch die Datenbank - siehe README_CONTAINER.md, Abschnitt "Stoppen"). Eine eigene
  # PostgreSQL-Sicherung gibt es bewusst nicht (Marco 05.10.2026): maßgeblich ist die
  # Termin-Datei der Desktop-App nach dem Zurückholen, gesichert über deren Datensicherung.
  shs_postgres_daten:
